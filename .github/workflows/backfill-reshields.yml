name: Backfill reshields
# One-off: fills the swap-output (reshield) history for the part of the 180-day
# window from before the daily job started keeping reshields. Start it from the
# Actions tab. It then runs the normal daily update so the pool, the metrics and
# the CSV files stay consistent, and commits the result like the daily job does.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-pool
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Read the missing reshield history
        run: node scripts/backfill-reshields.mjs
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
      - name: Rebuild the pool and the metrics
        run: npm run data:update
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
      - run: npm run build
      - run: npm run data:validate
      - name: Commit the verified snapshot
        id: snapshot
        shell: bash
        run: |
          git add data/deposits.csv data/reshields.csv public/data/railgun-eth.bin public/data/manifest.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Backfill RAILGUN WETH reshield history'
          git push
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Request Vercel deployment
        if: steps.snapshot.outputs.changed == 'true'
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: node scripts/deploy-hook.mjs
